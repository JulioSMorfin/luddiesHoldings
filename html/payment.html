<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/payment.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-pago" data-site-page="">
    <header id="site-header"></header>

    <main>
        <section class="hero-about pago-hero">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8 text-center fade-in">
                        <div class="pago-stub-icon mb-3" aria-hidden="true"><i class="fa-brands fa-stripe"></i></div>
                        <h1 class="hero-title mb-3" data-i18n="payment_stub_title"></h1>
                        <p class="hero-lead mx-auto mb-0" data-i18n="payment_stub_lead"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0 pb-5">
            <div class="container">
                <div class="pago-stub-panel brand-card p-4 p-md-5 mx-auto pago-stub-panel--narrow">
                    <div id="payment-checkout-view">
                        <p class="pago-stub-email-label mb-1" data-i18n="payment_stub_email_label"></p>
                        <p class="pago-stub-email-value mb-3" id="payment-stub-email">—</p>
                        
                        <div class="payment-total-box p-3 mb-4">
                            <span class="text-muted small">Total a pagar:</span>
                            <h3 class="payment-total-amount mb-0" id="payment-total">$0.00 MXN</h3>
                        </div>

                        <form id="payment-simulation-form" class="text-start mb-4">
                            <div class="mb-3">
                                <label class="form-label-luddies small">Número de tarjeta (Simulación)</label>
                                <input type="tel" id="cc-number" class="form-control-luddies w-100" placeholder="0000 0000 0000 0000" required maxlength="19" autocomplete="cc-number">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label-luddies small">Vencimiento</label>
                                    <input type="tel" id="cc-exp" class="form-control-luddies w-100" placeholder="MM/YY" required maxlength="5" autocomplete="cc-exp">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label-luddies small">CVC</label>
                                    <input type="password" id="cc-cvc" class="form-control-luddies w-100" placeholder="123" required maxlength="4" autocomplete="cc-csc" inputmode="numeric">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-luddies btn-luddies--submit w-100 mt-2" id="btn-simulate-pay">
                                Procesar Pago
                            </button>
                        </form>
                    </div>

                    <div id="payment-success-view" class="text-center" hidden>
                        <div class="payment-success-icon mb-3"><i class="fa-solid fa-circle-check"></i></div>
                        <h3 class="mb-2">¡Pago Exitoso!</h3>
                        <p class="text-muted mb-4">Tu orden ha sido procesada correctamente.</p>
                        <div class="d-flex flex-wrap gap-3 justify-content-center">
                            <a class="btn btn-luddies btn-luddies--primary" href="catalog.html" data-i18n="payment_stub_catalog"></a>
                            <a class="btn btn-luddies btn-luddies--outline" href="index.html" data-i18n="payment_stub_home"></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/auth-ui.js"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/payment.js"></script>
</body>
</html>
